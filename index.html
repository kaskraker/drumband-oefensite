<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oefensite Drumband Ingelmunster</title>
<meta name="description" content="Partituren, oefenvideo's en een metronoom voor de leden van de drumband van Kunst Veredelt Ingelmunster.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#BA0C2F">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preload" href="fonts/lulo-clean-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/tt-commons-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=pl7">
</head>
<body>
<header class="top">
  <div class="inner">
    <a href="#" class="brand" aria-label="Drumband Ingelmunster, naar het begin"><img src="img/logo-bone.png" alt="Drumband Ingelmunster" width="900" height="450"></a>
    <a href="#" class="site-name" aria-label="Oefensite, naar het begin">Oefensite</a>
    <div class="lvl" role="group" aria-label="Groep">
      <button type="button" data-level="starter" aria-pressed="false">Starters</button>
      <button type="button" data-level="gevorderd" aria-pressed="true">Gevorderden</button>
    </div>
    <button type="button" id="mbtn" class="mbtn" aria-expanded="false" aria-controls="mpanel">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8l-2.5-16h-3z"/><path d="M12 15l5-8"/></svg>
  <span class="lbl">Metronoom</span>
</button>
  </div>
</header>

<main id="main" class="inner"></main>

<footer class="inner foot">Alleen voor leden van de drumband. Deel de link niet buiten de vereniging.</footer>

<!-- PDF-lezer -->
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Partituur" hidden>
  <div class="vbar">
    <button type="button" id="vclose" class="vbtn" aria-label="Sluiten">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <h2 id="vtitle"></h2>
    <a id="vdl" class="btn" href="#" download>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
      <span>Download</span>
    </a>
  </div>
  <div id="vslot" class="vslot"></div>
  <div id="vpages" class="vpages"></div>
</div>

<div id="vmini" class="vmini inline mx" hidden role="group" aria-label="Metronoom">
  <div class="mx-row">
    <button type="button" id="vm-go" class="mx-play" aria-label="Metronoom starten"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
    <div class="mx-tempo">
      <button type="button" class="mx-step" id="vm-minus" aria-label="Trager">−</button>
      <div class="mx-bpm"><b id="vm-bpmv">90</b><small>bpm</small></div>
      <button type="button" class="mx-step" id="vm-plus" aria-label="Sneller">+</button>
    </div>
    <div class="mx-dots" id="vm-dots" aria-hidden="true"></div>
  </div>
  <div class="mx-chiprow">
    <div id="vm-pop" class="mx-chips" role="group" aria-label="Tempo kiezen"></div>
  </div>
</div>

<!-- Metronoom (paneel via de knop in de kop) -->
<section id="mpanel" class="mpanel mx" aria-label="Metronoom" hidden>
  <div class="mtop">
    <h2 class="mx-title">Metronoom</h2>
    <button type="button" id="mclose" class="vbtn" aria-label="Metronoom sluiten">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div class="mx-tempo big">
    <button type="button" class="mx-step" id="mminus" aria-label="Trager">−</button>
    <div class="mx-bpm"><b id="bpmv">90</b><small>bpm</small></div>
    <button type="button" class="mx-step" id="mplus" aria-label="Sneller">+</button>
  </div>
  <input id="mrange" class="mx-range" type="range" min="30" max="220" value="90" aria-label="Tempo">
  <div class="mx-dots big" id="dots" aria-hidden="true"></div>
  <div class="mx-opts">
    <label class="mx-sel">Maat
      <select id="mbeats"><option value="2">2/4</option><option value="3">3/4</option><option value="4" selected>4/4</option><option value="5">5/4</option><option value="6">6/8</option></select>
    </label>
    <button type="button" class="mx-tap" id="mtap">Tik het tempo</button>
  </div>
  <div class="mx-chips wrap" id="mpresets"></div>
  <button type="button" class="mx-play wide" id="mgo" aria-label="Metronoom starten"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg><span class="mx-golbl">Start</span></button>
</section>

<script src="vendor/pdf.min.js"></script>
<script src="data.js?v=pl7"></script>
<script src="js/basics.js?v=pl7"></script>
<script src="js/player.js?v=pl7"></script>
<script src="js/app.js?v=pl7"></script>
</body>
</html>
